name: Integration Tests

on:
  workflow_call:

  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'

jobs:
    test:
      runs-on: ubuntu-latest

      # Login shell so the conda env set up below is active in every step.
      # Snakemake shells out to `conda` for software-deployment-method: conda,
      # which isn't on the runner's PATH otherwise.
      defaults:
        run:
          shell: bash -el {0}

      steps:
      - uses: actions/checkout@v6

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: "3.12"
          activate-environment: sunbeam

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests
        run: |
          pytest -vvv -l tests/e2e/

    test-slurm:
        name: Slurm Test
        runs-on: ubuntu-latest
        services:
            mysql:
              image: mysql:8.0
              env:
                MYSQL_ROOT_PASSWORD: root
              ports:
                - "8888:3306"
              options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        defaults:
            run:
                shell: bash -el {0}

        steps:
            - uses: actions/checkout@v6
            - uses: koesterlab/setup-slurm-action@v1

            - name: Set up conda
              uses: conda-incubator/setup-miniconda@v4
              with:
                miniforge-version: latest
                python-version: "3.12"
                activate-environment: sunbeam

            - name: Install Sunbeam
              run: |
                python -m pip install --upgrade pip
                pip install .[dev]
                pip install snakemake-executor-plugin-slurm

            - name: Run Sunbeam
              run: |
                sunbeam init --data_fp tests/data/reads/ --profile slurm test/
                cat test/config.yaml
                sunbeam run test --default-resources slurm_account=runner --profile test/ --show-failed-logs
